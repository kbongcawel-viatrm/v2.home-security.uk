## Fluent Bit configuration for collecting suricata, auditd, journal, aide, kernel, and bootup logs
## Includes rotated logs and starts collecting immediately

[SERVICE]
    # Fluent Bit service configuration
    flush        1
    log_level    info
    parsers_file parsers.conf
    http_server  on
    http_listen  0.0.0.0
    http_port    2020
    
    # Immediately start collecting logs when service starts
    storage.path /var/log/flb_storage/
    storage.sync normal
    storage.metrics on
    storage.max_chunks_up 128
    
    # Rotated log handling
    file_rotated_logs on

## Input Plugins

# 1. Suricata logs (file-based, includes rotated logs)
[INPUT]
    Name          tail
    Tag           suricata
    Path          /var/log/suricata/*.log
    Parser        suricata
    DB            /var/log/flb_suricata.db
    Mem_Buf_Limit 5MB
    Refresh_Interval 10
    Rotate_Wait   5
    Skip_Long_Lines On
    storage.total_limit_size 10M

# 2. Auditd logs (file-based, includes rotated logs)
[INPUT]
    Name          tail
    Tag           auditd
    Path          /var/log/audit/audit.log
    Parser        auditd
    DB            /var/log/flb_auditd.db
    Mem_Buf_Limit 5MB
    Refresh_Interval 10
    Rotate_Wait   5
    Skip_Long_Lines On
    storage.total_limit_size 10M

# 3. AIDE logs (file-based, includes rotated logs)
[INPUT]
    Name          tail
    Tag           aide
    Path          /var/log/aide/*.log
    Parser        aide
    DB            /var/log/flb_aide.db
    Mem_Buf_Limit 5MB
    Refresh_Interval 10
    Rotate_Wait   5
    Skip_Long_Lines On
    storage.total_limit_size 10M

# 4. Kernel logs (file-based, includes rotated logs)
[INPUT]
    Name          tail
    Tag           kernel
    Path          /var/log/kern.log
    Parser        syslog-rfc3164
    DB            /var/log/flb_kernel.db
    Mem_Buf_Limit 5MB
    Refresh_Interval 10
    Rotate_Wait   5
    Skip_Long_Lines On
    storage.total_limit_size 10M

# 5. Boot logs (file-based, includes rotated logs)
[INPUT]
    Name          tail
    Tag           boot
    Path          /var/log/boot.log
    Parser        syslog-rfc3164
    DB            /var/log/flb_boot.db
    Mem_Buf_Limit 5MB
    Refresh_Interval 10
    Rotate_Wait   5
    Skip_Long_Lines On
    storage.total_limit_size 10M

# 6. Systemd Journal (for auditd journal logs)
[INPUT]
    Name          systemd
    Tag           journal.auditd
    Systemd_Filter _SYSTEMD_UNIT=auditd.service
    Strip_Underscores On
    Read_From_Tail On

# 7. Systemd Journal (for general system logs)
[INPUT]
    Name          systemd
    Tag           journal.system
    Strip_Underscores On
    Read_From_Tail On

## Parser Configuration (parsers.conf)
# Note: Parsers are defined in parsers.conf file

## Filter Plugins

# 1. Add Kubernetes metadata if running in Kubernetes
[FILTER]
    Name          kubernetes
    Match         *
    Kube_URL      https://kubernetes.default.svc:443
    Kube_CA_File  /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    Kube_Token_File /var/run/secrets/kubernetes.io/serviceaccount/token
    Kube_Tag_Prefix kube.var.log.containers.
    Merge_Log On
    Merge_Log_Key log_processed
    K8S-Logging.Parser On
    K8S-Logging.Exclude On

# 2. Normalize timestamps and add hostname
[FILTER]
    Name          nest
    Match         *
    Operation     lift
    Nested_under  log

[FILTER]
    Name          modify
    Match         *
    Add           hostname ${HOSTNAME}
    Add           _source_type ${FLUENT_BIT_TAG}

# 3. Handle multiline logs for suricata (if needed)
[FILTER]
    Name          multiline
    Match         suricata
    multiline.key_content log
    multiline.parser suricata_multiline

## Output Plugins
# Using stdout for demonstration - replace with your actual destination

# 1. Standard output (for testing/debugging)
[OUTPUT]
    Name          stdout
    Match         *
    Format        json_lines
    json_date_format iso8601

