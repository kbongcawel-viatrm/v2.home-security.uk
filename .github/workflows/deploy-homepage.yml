name: Homepage Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "homepage/**"
      - ".github/workflows/deploy-homepage.yml"

# Deny all token permissions by default; the deploy step authenticates to
# Cloudflare with its own API token, not the GitHub token.
permissions: {}

concurrency:
  group: homepage-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy homepage to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: homepage
        run: npm install

      - name: Deploy static assets to Cloudflare Workers
        working-directory: homepage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_KEY }}
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
