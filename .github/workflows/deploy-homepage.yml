name: Build and deploy homepage to Cloudflare Workers

# Production deployment is gated by the repository CF_API_TOKEN and CF_ACCOUNT_ID secrets.

on:
  push:
    branches:
      - main
    paths:
      - "homepage/**"
      - ".github/workflows/deploy-homepage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepage-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: homepage
        run: npm install

      - name: Validate Worker and static asset configuration
        working-directory: homepage
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc

      - name: Explain missing Cloudflare credential
        if: ${{ env.CF_API_KEY == '' }}
        run: echo "::notice::Add the CF_API_KEY repository secret to enable production deployment."

      - name: Deploy Worker and static assets
        if: ${{ env.CF_API_KEY != '' }}
        working-directory: homepage
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
