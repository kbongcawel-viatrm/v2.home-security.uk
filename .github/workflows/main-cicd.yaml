name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Deny all token permissions by default; grant only what each reusable job needs.
permissions: {}

concurrency:
  group: main-cicd-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  security-scan:
    name: Scan
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/security-scan.yml
    secrets: inherit

  staging-deployment:
    name: stg
    permissions:
      contents: read
      packages: write
    needs: security-scan
    if: needs.security-scan.result == 'success'
    uses: ./.github/workflows/stg-deployment.yml
    secrets: inherit

  production-deployment:
    name: prd
    permissions:
      contents: read
    needs:
      - security-scan
      - staging-deployment
    if: >-
      always() &&
      needs.security-scan.result == 'success' &&
      needs.staging-deployment.result == 'success'
    uses: ./.github/workflows/prd-deployment.yml
    secrets: inherit

  done:
    name: Done / Success
    needs: production-deployment
    if: needs.production-deployment.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Report successful pipeline
        run: echo "Security scan, staging deployment, and production deployment completed successfully."
