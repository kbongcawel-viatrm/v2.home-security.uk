name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  security-events: write
  packages: write

concurrency:
  group: main-cicd-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  security-scan:
    name: Run security scan
    uses: ./.github/workflows/security-scan.yml
    secrets: inherit

  staging-deployment:
    name: Deploy to staging
    needs: security-scan
    if: needs.security-scan.result == 'success'
    uses: ./.github/workflows/stg-deployment.yml
    secrets: inherit

  production-deployment:
    name: Deploy to production
    needs:
      - security-scan
      - staging-deployment
    if: >-
      always() &&
      needs.security-scan.result == 'success' &&
      needs.staging-deployment.result == 'success'
    uses: ./.github/workflows/prd-deployment.yml
    secrets: inherit
