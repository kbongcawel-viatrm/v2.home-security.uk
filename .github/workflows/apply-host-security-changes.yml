name: Apply Security Changes (GitHub-Hosted)

# This workflow runs on a GITHUB-HOSTED runner (ubuntu-latest) and connects
# to the target Fedora host via SSH to deploy security changes.
#
# Architecture:
#   1. deploy-v2-stack.yml (Toolbox/self-hosted) - deploys containers, generates artifacts
#   2. apply-host-security-changes.yml (GitHub-hosted) - deploys security changes via SSH
#
# The GitHub-hosted runner connects to the target host via SSH using:
#   - SSH private key stored in GitHub secrets (TARGET_SSH_KEY)
#   - Target host address stored in GitHub secrets (TARGET_HOST)
#   - Target user stored in GitHub secrets (TARGET_USER)
#   - Sudo password stored in GitHub secrets (TARGET_SUDO_PASSWORD)
#
# Required GitHub Secrets:
#   TARGET_HOST         - IP or hostname of the Fedora target host
#   TARGET_USER         - SSH user on target host
#   TARGET_SSH_KEY      - SSH private key for authentication
#   TARGET_SUDO_PASSWORD - Sudo password for privilege escalation (--become)
#
# Required GitHub Variables (optional):
#   TARGET_SSH_PORT - SSH port (default: 22)

on:
  workflow_dispatch:
    inputs:
      simulate:
        description: "Run validation and check-mode only (no host changes)"
        type: boolean
        required: true
        default: true
      deploy_suricata:
        description: "Deploy Suricata rules and reload Suricata"
        type: boolean
        required: true
        default: false
      deploy_firewalld:
        description: "Apply firewalld changes (block IPs/services)"
        type: boolean
        required: true
        default: false
      blocked_ip:
        description: "IP address to block (if deploy_firewalld is true)"
        type: string
        required: false
        default: ""
      block_zone:
        description: "Firewalld zone for blocking (default: public)"
        type: string
        required: false
        default: "public"
  workflow_call:
    inputs:
      simulate:
        description: "Run validation and check-mode only (no host changes)"
        type: boolean
        required: false
        default: true
      deploy_suricata:
        description: "Deploy Suricata rules and reload Suricata"
        type: boolean
        required: false
        default: false
      deploy_firewalld:
        description: "Apply firewalld changes (block IPs/services)"
        type: boolean
        required: false
        default: false
      blocked_ip:
        description: "IP address to block (if deploy_firewalld is true)"
        type: string
        required: false
        default: ""
      block_zone:
        description: "Firewalld zone for blocking"
        type: string
        required: false
        default: "public"

permissions:
  contents: read

concurrency:
  group: security-changes-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TARGET_HOST: ${{ secrets.TARGET_HOST }}
  TARGET_USER: ${{ secrets.TARGET_USER }}
  TARGET_PORT: ${{ vars.TARGET_SSH_PORT || '22' }}
  ANSIBLE_HOST_KEY_CHECKING: "False"
  # Pass sudo password via environment variable for --become
  ANSIBLE_BECOME_PASSWORD: ${{ secrets.TARGET_SUDO_PASSWORD }}

jobs:
  validate:
    name: Validate playbooks and artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      suricata_rules_present: ${{ steps.check-artifacts.outputs.suricata_rules_present }}
      firewalld_changes_present: ${{ steps.check-artifacts.outputs.firewalld_changes_present }}
    steps:
      - name: Check out repository content
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Ansible and dependencies
        run: |
          cd v2.home-security.uk || exit 1
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible-core PyYAML
          ansible-playbook --version

      - name: Check for artifacts
        id: check-artifacts
        run: |
          cd v2.home-security.uk || exit 1
          set -euo pipefail
          suricata_present="false"
          firewalld_present="false"
          if [[ -s artifacts/suricata.rules ]]; then
            echo "Found artifacts/suricata.rules"
            suricata_present="true"
          else
            echo "No artifacts/suricata.rules found (may be intentional)"
          fi
          if [[ -s artifacts/firewalld-blocks.json ]]; then
            echo "Found artifacts/firewalld-blocks.json"
            firewalld_present="true"
          else
            echo "No artifacts/firewalld-blocks.json found (may be intentional)"
          fi
          echo "suricata_rules_present=${suricata_present}" >> "$GITHUB_OUTPUT"
          echo "firewalld_changes_present=${firewalld_present}" >> "$GITHUB_OUTPUT"

      - name: Validate playbook policy
        run: |
          cd v2.home-security.uk || exit 1
          python3 scripts/validate-local-playbooks.py ansible/playbooks

      - name: Syntax-check all playbooks
        run: |
          cd v2.home-security.uk || exit 1
          set -euo pipefail
          mapfile -d '' playbooks < <(find ansible/playbooks -type f \( -name '*.yml' -o -name '*.yaml' \) ! -name '.gitkeep' -print0 | sort -z)
          if ((${#playbooks[@]} == 0)); then
            echo "::warning::No Ansible playbooks found under ansible/playbooks"
          fi
          for playbook in "${playbooks[@]}"; do
            echo "Syntax-check: $playbook"
            ansible-playbook --inventory 'localhost,' --connection local --syntax-check "$playbook"
          done

      - name: Upload artifacts for deployment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-artifacts
          path: |
            artifacts/
            ansible/
            scripts/
          retention-days: 1

  setup-ssh:
    name: Set up SSH connection to target host
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ssh_ok: ${{ steps.test-ssh.outputs.ssh_ok }}
    steps:
      - name: Check required secrets
        run: |
          cd v2.home-security.uk || exit 1
          if [[ -z "$TARGET_HOST" ]]; then
            echo "::error::TARGET_HOST secret is not set"
            exit 1
          fi
          if [[ -z "$TARGET_USER" ]]; then
            echo "::error::TARGET_USER secret is not set"
            exit 1
          fi
          if [[ -z "${{ secrets.TARGET_SSH_KEY }}" ]]; then
            echo "::error::TARGET_SSH_KEY secret is not set"
            exit 1
          fi
          if [[ -z "${{ secrets.TARGET_SUDO_PASSWORD }}" ]]; then
            echo "::error::TARGET_SUDO_PASSWORD secret is not set"
            exit 1
          fi
          echo "Target: $TARGET_USER@$TARGET_HOST:$TARGET_PORT"

      - name: Set up hardened SSH
        run: |
          cd v2.home-security.uk || exit 1
          ./scripts/setup-ssh.sh \
            "${{ secrets.TARGET_SSH_KEY }}" \
            "$TARGET_HOST" \
            "$TARGET_USER" \
            "$TARGET_PORT"

      - name: Test SSH connection
        id: test-ssh
        run: |
          cd v2.home-security.uk || exit 1
          if ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no \
             -p "$TARGET_PORT" "$TARGET_USER@$TARGET_HOST" "echo 'SSH connection successful'"; then
            echo "ssh_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::SSH connection failed"
            echo "ssh_ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Verify target host prerequisites
        run: |
          cd v2.home-security.uk || exit 1
          echo "=== Checking target host prerequisites ==="
          ssh -o StrictHostKeyChecking=no -p "$TARGET_PORT" "$TARGET_USER@$TARGET_HOST" << 'EOF'
          set -e
          echo "Host: $(hostname)"
          echo "OS: $(cat /etc/os-release | grep PRETTY_NAME)"
          
          # Check suricata
          if command -v suricata &>/dev/null; then
            echo "suricata: $(suricata --version 2>&1 | head -1)"
          else
            echo "suricata: NOT FOUND"
          fi
          
          # Check firewall-cmd
          if command -v firewall-cmd &>/dev/null; then
            echo "firewall-cmd: $(firewall-cmd --version 2>&1)"
          else
            echo "firewall-cmd: NOT FOUND"
          fi
          
          # Check systemd services
          systemctl is-active suricata 2>/dev/null && echo "suricata.service: active" || echo "suricata.service: not active"
          systemctl is-active firewalld 2>/dev/null && echo "firewalld.service: active" || echo "firewalld.service: not active"
          
          # Check directories
          [[ -d /var/lib/suricata/rules ]] && echo "/var/lib/suricata/rules: exists" || echo "/var/lib/suricata/rules: NOT FOUND"
          [[ -d /etc/suricata ]] && echo "/etc/suricata: exists" || echo "/etc/suricata: NOT FOUND"
          [[ -d /var/log/suricata ]] && echo "/var/log/suricata: exists" || echo "/var/log/suricata: NOT FOUND"
          EOF

      - name: Test sudo access on target
        run: |
          cd v2.home-security.uk || exit 1
          echo "=== Testing sudo access ==="
          # Test sudo with password via SSH
          if ssh -o StrictHostKeyChecking=no -p "$TARGET_PORT" "$TARGET_USER@$TARGET_HOST" \
             "echo '${{ secrets.TARGET_SUDO_PASSWORD }}' | sudo -S -k true 2>/dev/null && echo 'Sudo access: OK' || echo 'Sudo access: FAILED'"; then
            echo "Sudo check completed"
          else
            echo "::warning::Sudo test had issues - verify password is correct"
          fi

  deploy-suricata:
    name: Deploy Suricata rules (via SSH)
    needs: [validate, setup-ssh]
    if: needs.validate.outputs.suricata_rules_present == 'true' && needs.setup-ssh.outputs.ssh_ok == 'true' && (inputs.deploy_suricata == true || inputs.simulate == false)
    runs-on: ubuntu-latest
    environment: security-apply
    timeout-minutes: 15
    steps:
      - name: Check out repository content
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: security-artifacts
          path: .

      - name: Set up Python and Ansible
        run: |
          cd v2.home-security.uk || exit 1
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible-core PyYAML

      - name: Set up hardened SSH
        run: |
          cd v2.home-security.uk || exit 1
          ./scripts/setup-ssh.sh \
            "${{ secrets.TARGET_SSH_KEY }}" \
            "$TARGET_HOST" \
            "$TARGET_USER" \
            "$TARGET_PORT"

      - name: Create Ansible inventory
        run: |
          cd v2.home-security.uk || exit 1
          cat > inventory.ini << EOF
          [target]
          $TARGET_HOST ansible_host=$TARGET_HOST ansible_user=$TARGET_USER ansible_port=$TARGET_PORT ansible_ssh_private_key_file=~/.ssh/id_ed25519
          EOF
          cat inventory.ini

      - name: Check mode preview (dry-run)
        run: |
          cd v2.home-security.uk || exit 1
          set -euo pipefail
          echo "=== Check mode preview: deploy-suricata-rules.yml ==="
          ansible-playbook \
            --inventory inventory.ini \
            --limit target \
            --become \
            --check --diff \
            ansible/playbooks/deploy-suricata-rules.yml

      - name: Deploy Suricata rules and reload Suricata
        if: ${{ inputs.simulate == false }}
        run: |
          cd v2.home-security.uk || exit 1
          set -euo pipefail
          echo "=== Applying: deploy-suricata-rules.yml ==="
          ansible-playbook \
            --inventory inventory.ini \
            --limit target \
            --become \
            ansible/playbooks/deploy-suricata-rules.yml
          echo ""
          echo "=== Suricata rules deployed and service reloaded ==="

      - name: Verify deployment
        if: ${{ inputs.simulate == false }}
        run: |
          cd v2.home-security.uk || exit 1
          echo "=== Verifying Suricata deployment ==="
          ssh -o StrictHostKeyChecking=no -p "$TARGET_PORT" "$TARGET_USER@$TARGET_HOST" \
            "echo '${{ secrets.TARGET_SUDO_PASSWORD }}' | sudo -S -k bash -c '
              echo \"Rules file:\"
              ls -la /var/lib/suricata/rules/suricata.rules
              echo \"\"
              echo \"Suricata status:\"
              systemctl status suricata --no-pager | head -10
              echo \"\"
              echo \"Recent logs:\"
              tail -5 /var/log/suricata/suricata.log 2>/dev/null || echo \"No suricata.log found\"
            '"

      - name: Simulation completed
        if: ${{ inputs.simulate != false }}
        run: echo "Simulation passed; apply step was intentionally skipped."

  deploy-firewalld:
    name: Apply firewalld changes (via SSH)
    needs: [validate, setup-ssh]
    if: (needs.validate.outputs.firewalld_changes_present == 'true' || inputs.blocked_ip != '') && needs.setup-ssh.outputs.ssh_ok == 'true' && (inputs.deploy_firewalld == true || inputs.simulate == false)
    runs-on: ubuntu-latest
    environment: security-apply
    timeout-minutes: 15
    steps:
      - name: Check out repository content
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: security-artifacts
          path: .

      - name: Set up Python and Ansible
        run: |
          cd v2.home-security.uk || exit 1
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible-core PyYAML

      - name: Set up hardened SSH
        run: |
          cd v2.home-security.uk || exit 1
          ./scripts/setup-ssh.sh \
            "${{ secrets.TARGET_SSH_KEY }}" \
            "$TARGET_HOST" \
            "$TARGET_USER" \
            "$TARGET_PORT"

      - name: Create Ansible inventory
        run: |
          cd v2.home-security.uk || exit 1
          cat > inventory.ini << EOF
          [target]
          $TARGET_HOST ansible_host=$TARGET_HOST ansible_user=$TARGET_USER ansible_port=$TARGET_PORT ansible_ssh_private_key_file=~/.ssh/id_ed25519
          EOF
          cat inventory.ini

      - name: Block IP via Ansible (dry-run)
        if: ${{ inputs.blocked_ip != '' }}
        run: |
          cd v2.home-security.uk || exit 1
          set -euo pipefail
          echo "=== Check mode preview: block-ip-firewalld.yml ==="
          ansible-playbook \
            --inventory inventory.ini \
            --limit target \
            --become \
            --check --diff \
            --extra-vars "block_ip=${{ inputs.blocked_ip }} zone=${{ inputs.block_zone }}" \
            ansible/playbooks/block-ip-firewalld.yml

      - name: Block IP via Ansible (apply)
        if: ${{ inputs.simulate == false && inputs.blocked_ip != '' }}
        run: |
          cd v2.home-security.uk || exit 1
          set -euo pipefail
          echo "=== Applying: block-ip-firewalld.yml ==="
          ansible-playbook \
            --inventory inventory.ini \
            --limit target \
            --become \
            --extra-vars "block_ip=${{ inputs.blocked_ip }} zone=${{ inputs.block_zone }} reason='AI-recommended block'" \
            ansible/playbooks/block-ip-firewalld.yml
          echo "=== IP blocked successfully ==="

      - name: Process blocks from artifacts (dry-run)
        if: needs.validate.outputs.firewalld_changes_present == 'true'
        run: |
          cd v2.home-security.uk || exit 1
          set -euo pipefail
          python3 scripts/process-firewalld-blocks.py --check --inventory inventory.ini

      - name: Process blocks from artifacts (apply)
        if: ${{ inputs.simulate == false && needs.validate.outputs.firewalld_changes_present == 'true' }}
        run: |
          cd v2.home-security.uk || exit 1
          set -euo pipefail
          python3 scripts/process-firewalld-blocks.py --inventory inventory.ini

      - name: Verify firewalld changes
        if: ${{ inputs.simulate == false }}
        run: |
          cd v2.home-security.uk || exit 1
          echo "=== Verifying firewalld changes ==="
          ssh -o StrictHostKeyChecking=no -p "$TARGET_PORT" "$TARGET_USER@$TARGET_HOST" \
            "echo '${{ secrets.TARGET_SUDO_PASSWORD }}' | sudo -S -k bash -c '
              echo \"Active zones:\"
              firewall-cmd --get-active-zones
              echo \"\"
              echo \"Rich rules:\"
              firewall-cmd --list-rich-rules
              echo \"\"
              echo \"Firewalld status:\"
              systemctl status firewalld --no-pager | head -5
            '"

      - name: Simulation completed
        if: ${{ inputs.simulate != false }}
        run: echo "Simulation passed; apply steps were intentionally skipped."

  summary:
    name: Deployment summary
    needs: [validate, setup-ssh, deploy-suricata, deploy-firewalld]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Print summary
        run: |
          cd v2.home-security.uk || exit 1
          echo "=== Security Changes Deployment Summary ==="
          echo "Target host: $TARGET_USER@$TARGET_HOST:$TARGET_PORT"
          echo ""
          echo "Validation: ${{ needs.validate.result }}"
          echo "SSH Setup: ${{ needs.setup-ssh.result }}"
          echo "Suricata deployment: ${{ needs.deploy-suricata.result }}"
          echo "Firewalld deployment: ${{ needs.deploy-firewalld.result }}"
          echo ""
          if [[ "${{ needs.deploy-suricata.result }}" == "success" ]]; then
            echo "PASS: Suricata rules deployed and service reloaded"
          fi
          if [[ "${{ needs.deploy-firewalld.result }}" == "success" ]]; then
            echo "PASS: Firewalld changes applied"
          fi
          echo ""
          echo "Verify on target host:"
          echo "  ssh $TARGET_USER@$TARGET_HOST 'sudo systemctl status suricata'"
          echo "  ssh $TARGET_USER@$TARGET_HOST 'sudo firewall-cmd --list-all'"
          echo "  ssh $TARGET_USER@$TARGET_HOST 'sudo tail -f /var/log/suricata/suricata.log'"
