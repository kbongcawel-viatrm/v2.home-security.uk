name: Security Scan

on:
  workflow_call:
  push:
    branches:
       - "dev"
       - "v2.0"
  pull_request:
    branches:
       - "main"
       - "v2.0"
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
      inputs:
         skip_scan:
           description: "Skip scan and mark as successful?"
           type: boolean
           required: false
           default: false

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: home-security-stack-deployment
  cancel-in-progress: false
  queue: max
  
jobs:
  security-scan:
    name: Secret and Container Image Scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    ##########################################################################################
    ## ** This skips the job execution if the checkbox is checked, marking it successful ** ##
    ##########################################################################################
    if: ${{ github.event.inputs.skip_scan != 'true' }}
    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      # --------------------------------------------------
      # 2. Setup Node.js LTS
      # --------------------------------------------------
      - name: Setup Node.js LTS
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
      # --------------------------------------------------
      # 2. Upgrade pip on the GitHub Actions runner
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.15.2'
     
      - name: Install/Upgrade needed dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Show logs"
          python -m pip install --upgrade pip
          echo "::endgroup::"
          python -m pip --version
          
      # --------------------------------------------------
      # 3. Gitleaks secret detection
      # --------------------------------------------------
      - name: Run Gitleaks secret detection
        id: gitleaks
        uses: gitleaks/gitleaks-action@v3
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"
          # Required for organization-owned repositories.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      # --------------------------------------------------
      # 4. Install Trivy
      # --------------------------------------------------
      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.76.2
          cache: true

      # --------------------------------------------------
      # 5. Configure BuildKit caching for container builds
      # --------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2
        with:
          version: latest

      # --------------------------------------------------
      # 6. Pull and build container images
      # --------------------------------------------------
      - name: Pull and build Compose images
        id: build-images
        env:
          OPENOBSERVE_USER: ${{ secrets.OPENOBSERVE_USER }}
          OPENOBSERVE_PASSWORD: ${{ secrets.OPENOBSERVE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Show logs"
          COMPOSE_FILE="v2.home-security.uk/compose.yaml"
          APP_DIR="v2.home-security.uk"
          RESULTS_DIR="security-results"
          WORKER_IMAGE="demo.goharbor.io/home-security-uk/worker-template:1.3"

          mkdir -p \
            "$RESULTS_DIR/json" \
            "$RESULTS_DIR/sarif"

          if [[ ! -f "$COMPOSE_FILE" ]]; then
            echo "::error::Compose file not found: $COMPOSE_FILE"
            exit 1
          fi

          # Generate a CI-only .env from the repository example. Never use production
          # credentials in this job; the temporary file is removed by the EXIT trap.
          ENV_EXAMPLE="$APP_DIR/.env.example"
          ENV_FILE="$APP_DIR/.env"
          if [[ ! -f "$ENV_EXAMPLE" ]]; then
            echo "::error::Environment example not found: $ENV_EXAMPLE"
            exit 1
          fi
          cp "$ENV_EXAMPLE" "$ENV_FILE"
          CONFIG_JSON=""
          CACHE_OVERRIDE=""
          cleanup() {
            rm -f "$ENV_FILE"
            if [[ -n "$CONFIG_JSON" ]]; then
              rm -f "$CONFIG_JSON"
            fi
            if [[ -n "$CACHE_OVERRIDE" ]]; then
              rm -f "$CACHE_OVERRIDE"
            fi
          }
          trap cleanup EXIT

          # Credentials come from GitHub Actions Secrets, never tracked files.
          : "${OPENOBSERVE_USER:?GitHub secret OPENOBSERVE_USER is not configured}"
          : "${OPENOBSERVE_PASSWORD:?GitHub secret OPENOBSERVE_PASSWORD is not configured}"

          # Write Compose dotenv values safely; do not source this file as shell code.
          python3 - "$ENV_FILE" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          env_file = Path(sys.argv[1])
          values = {
              "OPENOBSERVE_USER": os.environ["OPENOBSERVE_USER"],
              "OPENOBSERVE_PASSWORD": os.environ["OPENOBSERVE_PASSWORD"],
          }
          lines = env_file.read_text().splitlines()
          found = set()
          output = []
          for line in lines:
              if not line.strip() or line.lstrip().startswith("#") or "=" not in line:
                  output.append(line)
                  continue
              key = line.split("=", 1)[0].strip()
              if key in values:
                  output.append(f"{key}={json.dumps(values[key])}")
                  found.add(key)
              else:
                  output.append(line)
          missing = set(values) - found
          if missing:
              raise SystemExit("Required keys absent from .env.example: " + ", ".join(sorted(missing)))
          env_file.write_text("\n".join(output) + "\n")
          PY

          # Pass the temporary env file explicitly because the Compose file
          # is not at the repository root.
          # Keep GitHub Actions cache configuration out of the portable Compose file.
          # Compose merges this temporary override with the repository configuration.
          CACHE_OVERRIDE="$(mktemp)"
          cat > "$CACHE_OVERRIDE" <<'YAML'
          services:
            openobserve:
              build:
                cache_from:
                  - type=gha,scope=openobserve
                cache_to:
                  - type=gha,mode=max,scope=openobserve,ignore-error=true
          YAML

          COMPOSE=(docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" -f "$CACHE_OVERRIDE")

          # Validate interpolation and render the resolved Compose model.
          "${COMPOSE[@]}" config --quiet
          CONFIG_JSON="$(mktemp)"
          "${COMPOSE[@]}" config --format json > "$CONFIG_JSON"

          # Pull registry images explicitly. Compose pull policies are intended
          # for runtime behavior; CI must ensure every scan target is local.
          python3 - "$CONFIG_JSON" "$RESULTS_DIR/pull-images.txt" "$WORKER_IMAGE" <<'PY'
          import json
          import sys
          from pathlib import Path

          config_path, output_path, worker_image = sys.argv[1:]
          config = json.loads(Path(config_path).read_text())
          images_to_pull = set()

          for service in config.get("services", {}).values():
              image = service.get("image")
              if not image:
                  continue
              if service.get("build") is not None:
                  continue
              if image == worker_image:
                  continue
              images_to_pull.add(image)

          Path(output_path).write_text(
              "".join(f"{image}\n" for image in sorted(images_to_pull))
          )
          PY

          while IFS= read -r image; do
            [[ -n "$image" ]] || continue
            echo "Pulling external image: $image"
            docker pull "$image"
          done < "$RESULTS_DIR/pull-images.txt"

          # Build services that declare a Compose build context.
          "${COMPOSE[@]}" build --pull

          # Build the worker image using the exact tag referenced by Compose.
          WORKER_DOCKERFILE="$APP_DIR/worker-image/Dockerfile"
          if [[ -f "$WORKER_DOCKERFILE" ]]; then
            docker buildx build \
              --pull \
              --load \
              --cache-from "type=gha,scope=worker-template" \
              --cache-to "type=gha,mode=max,scope=worker-template,ignore-error=true" \
              --file "$WORKER_DOCKERFILE" \
              --tag "$WORKER_IMAGE" \
              "$APP_DIR"
          else
            echo "::error::Worker Dockerfile not found: $WORKER_DOCKERFILE"
            exit 1
          fi

          # Discover the final Compose image set and verify every image exists.
          "${COMPOSE[@]}" config --images \
            | sort -u > "$RESULTS_DIR/images.txt"

          if [[ ! -s "$RESULTS_DIR/images.txt" ]]; then
            echo "::error::No container images were discovered."
            exit 1
          fi

          while IFS= read -r image; do
            [[ -n "$image" ]] || continue
            if ! docker image inspect "$image" >/dev/null 2>&1; then
              echo "::error::Image is missing locally after preparation: $image"
              exit 1
            fi
          done < "$RESULTS_DIR/images.txt"
          echo "::endgroup::"
          echo "Images queued for scanning:"
          cat "$RESULTS_DIR/images.txt"
         
      # --------------------------------------------------
      # 7. Scan every image with Trivy
      # --------------------------------------------------
      - name: Scan container images
        id: scan-images
        shell: bash
        run: |
          set -uo pipefail
          echo "::group::Show logs"
          RESULTS_DIR="security-results"

          : > "$RESULTS_DIR/scan-errors.txt"
          : > "$RESULTS_DIR/manifest.tsv"

          while IFS= read -r image; do
            [[ -n "$image" ]] || continue

            IMAGE_ID="$(printf '%s' "$image" | sha256sum | cut -c1-12)"

            printf '%s\t%s\n' \
              "$image" "$IMAGE_ID" \
              >> "$RESULTS_DIR/manifest.tsv"

            echo "Scanning: $image"

            # JSON report for HTML generation.
            if ! trivy image \
              --quiet \
              --scanners vuln \
              --severity CRITICAL,HIGH,MEDIUM \
              --format json \
              --output "$RESULTS_DIR/json/${IMAGE_ID}.json" \
              "$image"; then

              echo "$image (JSON scan failed)" \
                >> "$RESULTS_DIR/scan-errors.txt"
            fi

            # SARIF report for GitHub Security.
            if ! trivy image \
              --quiet \
              --scanners vuln \
              --severity CRITICAL,HIGH,MEDIUM \
              --format sarif \
              --output "$RESULTS_DIR/sarif/${IMAGE_ID}.sarif" \
              "$image"; then
             
              echo "$image (SARIF scan failed)" \
                >> "$RESULTS_DIR/scan-errors.txt"
            fi
          echo "::endgroup::"  
          done < "$RESULTS_DIR/images.txt"

      # --------------------------------------------------
      # 8. Generate HTML and Markdown security summaries
      # --------------------------------------------------
      - name: Generate security reports
        if: always()
        shell: bash
        run: |
          echo "::group::Show logs"
          python3 - <<'PY'
          import html
          import json
          from pathlib import Path

          root = Path("security-results")
          root.mkdir(parents=True, exist_ok=True)

          totals = {
              "CRITICAL": 0,
              "HIGH": 0,
              "MEDIUM": 0,
              "LOW": 0,
              "UNKNOWN": 0,
          }

          rows = []
          image_count = 0

          manifest = root / "manifest.tsv"

          if manifest.exists():
              for line in manifest.read_text().splitlines():
                  if not line.strip():
                      continue

                  image, image_id = line.split("\t", 1)

                  report_path = root / "json" / f"{image_id}.json"

                  if not report_path.exists():
                      continue

                  image_count += 1
                  report = json.loads(report_path.read_text())

                  for result in report.get("Results") or []:
                      for vuln in result.get("Vulnerabilities") or []:

                          severity = (
                              vuln.get("Severity") or "UNKNOWN"
                          ).upper()

                          totals[severity] = totals.get(severity, 0) + 1

                          rows.append({
                              "image": image,
                              "id": vuln.get("VulnerabilityID", "N/A"),
                              "severity": severity,
                              "package": vuln.get("PkgName", "N/A"),
                              "installed": vuln.get("InstalledVersion", "N/A"),
                              "fixed": vuln.get("FixedVersion") or "Not available",
                              "title": vuln.get("Title") or "",
                          })

          # Give every SARIF report a unique analysis identifier.
          sarif_dir = root / "sarif"

          for sarif_path in sarif_dir.glob("*.sarif"):
              data = json.loads(sarif_path.read_text())

              for run in data.get("runs", []):
                  run["automationDetails"] = {
                      "id": f"trivy-container-image/{sarif_path.stem}"
                  }

              sarif_path.write_text(
                  json.dumps(data, indent=2) + "\n"
              )

          # Count Gitleaks findings if its SARIF report exists.
          gitleaks_count = 0
          gitleaks_path = Path("results.sarif")

          if gitleaks_path.exists():
              try:
                  gitleaks_data = json.loads(
                      gitleaks_path.read_text()
                  )

                  gitleaks_count = sum(
                      len(run.get("results", []))
                      for run in gitleaks_data.get("runs", [])
                  )
              except (json.JSONDecodeError, OSError):
                  pass

          errors_path = root / "scan-errors.txt"

          errors = (
              errors_path.read_text().splitlines()
              if errors_path.exists()
              else []
          )

          severity_order = [
              "CRITICAL",
              "HIGH",
              "MEDIUM",
              "LOW",
              "UNKNOWN",
          ]

          summary_rows = "".join(
              f"<tr>"
              f"<td>{html.escape(row['severity'])}</td>"
              f"<td>{html.escape(row['image'])}</td>"
              f"<td>{html.escape(row['id'])}</td>"
              f"<td>{html.escape(row['package'])}</td>"
              f"<td>{html.escape(row['installed'])}</td>"
              f"<td>{html.escape(row['fixed'])}</td>"
              f"<td>{html.escape(row['title'])}</td>"
              f"</tr>"
              for row in rows
          )

          if not summary_rows:
              summary_rows = (
                  '<tr><td colspan="7">'
                  'No image vulnerabilities reported.'
                  '</td></tr>'
              )

          error_html = "".join(
              f"<li>{html.escape(error)}</li>"
              for error in errors
          ) or "<li>None</li>"

          html_report = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Container Security Scan</title>
            <style>
              body {{
                font: 14px/1.5 system-ui, sans-serif;
                margin: 2rem;
                color: #222;
              }}
              table {{
                border-collapse: collapse;
                width: 100%;
                margin-top: 1rem;
              }}
              th, td {{
                border: 1px solid #ccc;
                padding: .5rem;
                text-align: left;
              }}
              th {{ background: #eee; }}
              .metrics {{
                display: flex;
                flex-wrap: wrap;
                gap: 1rem;
              }}
              .metric {{
                border: 1px solid #ccc;
                padding: .75rem 1rem;
                min-width: 7rem;
              }}
            </style>
          </head>
          <body>
            <h1>Container Security Scan</h1>

            <p>
              Images scanned: {image_count}
              | Gitleaks findings: {gitleaks_count}
            </p>

            <div class="metrics">
              {''.join(
                  f'<div class="metric"><strong>{severity}</strong><br>'
                  f'{totals.get(severity, 0)}</div>'
                  for severity in severity_order
              )}
            </div>

            <h2>Image Vulnerabilities</h2>

            <table>
              <thead>
                <tr>
                  <th>Severity</th>
                  <th>Image</th>
                  <th>Vulnerability</th>
                  <th>Package</th>
                  <th>Installed</th>
                  <th>Fixed</th>
                  <th>Description</th>
                </tr>
              </thead>
              <tbody>{summary_rows}</tbody>
            </table>

            <h2>Scan Errors</h2>
            <ul>{error_html}</ul>
          </body>
          </html>
          """

          (root / "security-report.html").write_text(html_report)

          markdown = [
              "## Container Security Scan",
              "",
              f"- Images scanned: **{image_count}**",
              f"- Gitleaks findings: **{gitleaks_count}**",
              "",
              "| Severity | Findings |",
              "|---|---:|",
          ]

          markdown.extend(
              f"| {severity} | {totals.get(severity, 0)} |"
              for severity in severity_order
          )

          markdown.extend([
              "",
              f"- Scan errors: **{len(errors)}**",
          ])

          if errors:
              markdown.extend(
                  f"  - `{error}`"
                  for error in errors
              )

          (root / "summary.md").write_text(
              "\n".join(markdown) + "\n"
          )
          PY
          echo "::endgroup::"
          cat security-results/summary.md >> "$GITHUB_STEP_SUMMARY"

      # --------------------------------------------------
      # 9. Upload Gitleaks findings to GitHub Security
      # --------------------------------------------------
      - name: Upload Gitleaks results
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: gitleaks

      # --------------------------------------------------
      # 10. Upload Trivy findings to GitHub Security
      # --------------------------------------------------
      - name: Upload Trivy results
        if: always() && hashFiles('security-results/sarif/*.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: security-results/sarif/

      # --------------------------------------------------
      # 11. Upload reports and artifacts
      # --------------------------------------------------
      - name: Upload security reports and HTML summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: security-scan-${{ github.run_number }}
          path: |
            security-results/
            results.sarif
          if-no-files-found: warn
          retention-days: 30

      # --------------------------------------------------
      # 12. Enforce scan execution result
      # --------------------------------------------------
      - name: Validate security scan execution
        if: always()
        shell: bash
        env:
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
          BUILD_OUTCOME: ${{ steps.build-images.outcome }}
          TRIVY_OUTCOME: ${{ steps.scan-images.outcome }}
        run: |
          set -euo pipefail
          
          failed=0

          for result in \
            "Gitleaks:$GITLEAKS_OUTCOME" \
            "Image build:$BUILD_OUTCOME" \
            "Trivy scan:$TRIVY_OUTCOME"
          do
            name="${result%%:*}"
            outcome="${result#*:}"

            echo "$name: $outcome"

            [[ "$outcome" == "success" ]] || failed=1
          done

          if [[ -s security-results/scan-errors.txt ]]; then
            echo "::error::One or more image scans failed."
            cat security-results/scan-errors.txt
            failed=1
          fi

          exit "$failed"
