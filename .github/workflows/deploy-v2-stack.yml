name: Deploy Home Security Stack V2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-security-stack-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, Validate and Deploy
    runs-on:
      #- self-hosted
      #- fedora-secureblue
      - ubuntu-latest
    timeout-minutes: 30

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Install Podman and podman-compose if missing
      # --------------------------------------------------
      - name: Install container tooling
        shell: bash
        run: |
          set -euo pipefail

          install_packages() {
            if [ "$(id -u)" -eq 0 ]; then
              "$@"
            elif command -v sudo >/dev/null 2>&1; then
              sudo "$@"
            else
              echo "::error::Root privileges are required to install system packages."
              exit 1
            fi
          }

          if ! command -v podman >/dev/null 2>&1; then
            echo "Podman is missing. Installing..."

            if command -v apt-get >/dev/null 2>&1; then
              install_packages apt-get update
              install_packages apt-get install -y podman

            elif command -v dnf >/dev/null 2>&1; then
              install_packages dnf install -y podman

            elif command -v rpm-ostree >/dev/null 2>&1; then
              echo "::error::Podman is missing on an rpm-ostree system."
              echo "Provision Podman before running this workflow."
              exit 1

            else
              echo "::error::Unsupported package manager."
              exit 1
            fi
          fi

          if ! command -v podman-compose >/dev/null 2>&1; then
            echo "podman-compose is missing. Installing..."

            if ! command -v pipx >/dev/null 2>&1; then
              if command -v apt-get >/dev/null 2>&1; then
                install_packages apt-get install -y pipx

              elif command -v dnf >/dev/null 2>&1; then
                install_packages dnf install -y pipx

              else
                echo "::error::pipx is required to install podman-compose."
                exit 1
              fi
            fi

            pipx install podman-compose
          fi

          # Add common user-level executable directories to PATH.
          for dir in \
            "$HOME/.local/bin" \
            "$HOME/.local/pipx/venvs/podman-compose/bin"
          do
            if [ -d "$dir" ]; then
              echo "$dir" >> "$GITHUB_PATH"
              export PATH="$dir:$PATH"
            fi
          done

          command -v podman
          command -v podman-compose

          podman --version
          podman-compose --version

      # --------------------------------------------------
      # 3. Configure container registry policy
      # --------------------------------------------------
      - name: Configure container registry policy
        shell: bash
        run: |
          set -euo pipefail

          POLICY_SOURCE="./container-policy.json"
          POLICY_DESTINATION="$HOME/.config/containers/policy.json"

          if [ ! -f "$POLICY_SOURCE" ]; then
            echo "::error::container-policy.json not found."
            exit 1
          fi

          # Validate JSON without displaying its contents.
          python3 -m json.tool "$POLICY_SOURCE" >/dev/null

          mkdir -p "$(dirname "$POLICY_DESTINATION")"

          # Back up an existing user-level policy.
          if [ -f "$POLICY_DESTINATION" ]; then
            cp "$POLICY_DESTINATION" \
              "${POLICY_DESTINATION}.backup"
          fi

          install -m 600 \
            "$POLICY_SOURCE" \
            "$POLICY_DESTINATION"

          echo "Container policy configured."
          echo "Policy location: $POLICY_DESTINATION"

      # --------------------------------------------------
      # 4. Generate .env using GitHub Secrets
      # --------------------------------------------------
      - name: Generate environment configuration
        shell: bash
        env:
          OPENOBSERVE_USER: ${{ secrets.OPENOBSERVE_USER }}
          OPENOBSERVE_PASSWORD: ${{ secrets.OPENOBSERVE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          if [ ! -f .env.example ]; then
            echo "::error::.env.example not found."
            exit 1
          fi

          python3 - <<'PY'
          import os
          from pathlib import Path

          source = Path(".env.example")
          destination = Path(".env")

          required = {
              "OPENOBSERVE_USER": os.environ.get("OPENOBSERVE_USER", ""),
              "OPENOBSERVE_PASSWORD": os.environ.get("OPENOBSERVE_PASSWORD", ""),
          }

          missing = [
              key for key, value in required.items()
              if not value
          ]

          if missing:
              raise SystemExit(
                  "Missing required GitHub Secrets: "
                  + ", ".join(missing)
              )

          for key, value in required.items():
              if "\n" in value or "\r" in value:
                  raise SystemExit(
                      f"{key} contains an unsupported newline."
                  )

          lines = source.read_text().splitlines()
          counts = {key: 0 for key in required}
          output = []

          def quote_dotenv(value):
              return "'" + value.replace("\\", "\\\\").replace("'", "\\'") + "'"

          for line in lines:
              if "=" not in line or line.lstrip().startswith("#"):
                  output.append(line)
                  continue

              key = line.split("=", 1)[0].strip()

              if key in required:
                  counts[key] += 1
                  output.append(
                      f"{key}={quote_dotenv(required[key])}"
                  )
              else:
                  output.append(line)

          invalid = [
              key for key, count in counts.items()
              if count != 1
          ]

          if invalid:
              raise SystemExit(
                  "Expected exactly one entry in .env.example for: "
                  + ", ".join(invalid)
              )

          destination.write_text("\n".join(output) + "\n")
          destination.chmod(0o600)

          print(".env generated successfully.")
          print("Required secret variables populated.")
          PY

      # --------------------------------------------------
      # 5. Pull container images and build worker-template
      # --------------------------------------------------
      - name: Pull container images
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f compose.yaml ]; then
            echo "::error::compose.yaml not found."
            exit 1
          fi

          podman-compose -f compose.yaml pull

      - name: Build worker-template image
        shell: bash
        run: |
          set -euo pipefail

          WORKER_TEMPLATE_CONTEXT="./worker-template"
          WORKER_TEMPLATE_IMAGE="demo.goharbor.io/home-security-uk/worker-template:1.3"

          if [ ! -d "$WORKER_TEMPLATE_CONTEXT" ]; then
            echo "::error::Worker template build context not found: $WORKER_TEMPLATE_CONTEXT"
            exit 1
          fi

          if [ ! -f "$WORKER_TEMPLATE_CONTEXT/Dockerfile" ]; then
            echo "::error::Worker template Dockerfile not found."
            exit 1
          fi

          podman build \
            --tag "$WORKER_TEMPLATE_IMAGE" \
            "$WORKER_TEMPLATE_CONTEXT"

          podman image exists "$WORKER_TEMPLATE_IMAGE"

          echo "Worker template image built successfully."

      # --------------------------------------------------
      # 6. Validate compose.yaml
      # --------------------------------------------------
      - name: Validate Compose configuration
        shell: bash
        run: |
          set -euo pipefail

          podman-compose -f compose.yaml config >/dev/null

          echo "Compose configuration validation passed."

      # --------------------------------------------------
      # 7. Start stack using launch-stack.sh option 1
      # --------------------------------------------------
      - name: Start container stack
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="./scripts/launch-stack.sh"

          if [ ! -f "$SCRIPT" ]; then
            echo "::error::launch-stack.sh not found."
            exit 1
          fi

          chmod +x "$SCRIPT"

          echo "Starting stack using menu option 1..."

          printf '1\n' | timeout 180s bash "$SCRIPT"

          echo "Stack startup command completed."

      # --------------------------------------------------
      # 8. Check container health using option 4
      # --------------------------------------------------
      - name: Validate container health
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="./scripts/launch-stack.sh"

          echo "Checking container health using menu option 4..."

          printf '4\n' | timeout 60s bash "$SCRIPT"

          echo
          echo "Container status:"
          podman ps -a \
            --format "table {{.Names}}\t{{.Status}}"

          echo
          echo "Container health validation completed."

      # --------------------------------------------------
      # 9. Deployment completed
      # --------------------------------------------------
      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          echo "========================================"
          echo "Home Security Stack Deployment: SUCCESS"
          echo "========================================"
          echo "Images pulled."
          echo "Worker template image built."
          echo "Compose configuration validated."
          echo "Stack startup completed."
          echo "Container health check completed."
          echo "========================================"

      # --------------------------------------------------
      # Failure diagnostics
      # --------------------------------------------------
      - name: Collect container diagnostics
        if: failure()
        shell: bash
        run: |
          echo "Deployment failed. Collecting diagnostics..."

          podman ps -a \
            --format "table {{.Names}}\t{{.Status}}" || true

          echo
          echo "Container resource usage:"

          podman stats --no-stream || true
