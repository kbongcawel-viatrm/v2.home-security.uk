name: Production

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: home-security-stack-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deployment
    # The caller enforces successful security scan and staging deployment.
    runs-on:
      - self-hosted
      - fedora-secureblue

    timeout-minutes: 45

    steps:
      # --------------------------------------------------
      # 1. Checkout the exact commit that passed scanning
      # --------------------------------------------------
      - name: Checkout scanned commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      # --------------------------------------------------
      # 2. Configure application directory and tooling
      # --------------------------------------------------
      - name: Configure deployment environment
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="v2.home-security.uk"

          if [[ ! -d "$APP_DIR" ]]; then
            echo "::error::Application directory not found: $APP_DIR"
            exit 1
          fi

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

          for cmd in podman podman-compose python3 timeout; do
            if ! command -v "$cmd" >/dev/null 2>&1; then
              echo "::error::Required command is missing: $cmd"
              echo "Install Podman and podman-compose on the Fedora Secureblue runner."
              exit 1
            fi
          done

          podman --version
          podman-compose --version

          podman info >/dev/null

      # --------------------------------------------------
      # 3. Configure container signature policy
      # --------------------------------------------------
      - name: Configure container registry policy
        shell: bash
        run: |
          set -euo pipefail

          POLICY_SOURCE="$APP_DIR/containers-policy.json"
          POLICY_DESTINATION="$HOME/.config/containers/policy.json"

          if [[ ! -f "$POLICY_SOURCE" ]]; then
            echo "::error::containers-policy.json not found."
            exit 1
          fi

          python3 -m json.tool "$POLICY_SOURCE" >/dev/null

          mkdir -p "$(dirname "$POLICY_DESTINATION")"

          if [[ -f "$POLICY_DESTINATION" ]]; then
            cp "$POLICY_DESTINATION" \
              "${POLICY_DESTINATION}.backup"
          fi

          install -m 600 \
            "$POLICY_SOURCE" \
            "$POLICY_DESTINATION"

          echo "Container signature policy configured."

      # --------------------------------------------------
      # 4. Generate .env from GitHub Secrets
      # --------------------------------------------------
      - name: Generate environment configuration
        shell: bash
        working-directory: v2.home-security.uk
        env:
          OPENOBSERVE_USER: ${{ secrets.OPENOBSERVE_USER }}
          OPENOBSERVE_PASSWORD: ${{ secrets.OPENOBSERVE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          if [[ ! -f .env.example ]]; then
            echo "::error::.env.example not found."
            exit 1
          fi

          python3 - <<'PY'
          import os
          from pathlib import Path

          source = Path(".env.example")
          destination = Path(".env")

          required = {
              "OPENOBSERVE_USER": os.environ.get("OPENOBSERVE_USER", ""),
              "OPENOBSERVE_PASSWORD": os.environ.get("OPENOBSERVE_PASSWORD", ""),
          }

          missing = [
              key for key, value in required.items()
              if not value
          ]

          if missing:
              raise SystemExit(
                  "Missing GitHub Secrets: " + ", ".join(missing)
              )

          for key, value in required.items():
              if "\n" in value or "\r" in value:
                  raise SystemExit(
                      f"{key} contains an unsupported newline."
                  )

          lines = source.read_text().splitlines()
          counts = {key: 0 for key in required}
          output = []

          def quote_dotenv(value):
              escaped = value.replace("\\", "\\\\").replace('"', '\\"')
              return f'"{escaped}"'

          for line in lines:
              if "=" not in line or line.lstrip().startswith("#"):
                  output.append(line)
                  continue

              key = line.split("=", 1)[0].strip()

              if key in required:
                  counts[key] += 1
                  output.append(f"{key}={quote_dotenv(required[key])}")
              else:
                  output.append(line)

          invalid = [
              key for key, count in counts.items()
              if count != 1
          ]

          if invalid:
              raise SystemExit(
                  "Expected exactly one .env.example entry for: "
                  + ", ".join(invalid)
              )

          destination.write_text("\n".join(output) + "\n")
          destination.chmod(0o600)

          print(".env generated successfully.")
          PY

      # --------------------------------------------------
      # 5. Pull container images
      # --------------------------------------------------
      - name: Pull container images
        shell: bash
        working-directory: v2.home-security.uk
        run: |
          set -euo pipefail

          podman-compose -f compose.yaml pull

      # --------------------------------------------------
      # 6. Build worker-template image
      # --------------------------------------------------
      - name: Build worker-template image
        shell: bash
        working-directory: v2.home-security.uk
        run: |
          set -euo pipefail

          IMAGE="demo.goharbor.io/home-security-uk/worker-template:1.4"
          CONTEXT="./worker-image"

          if [[ ! -f "$CONTEXT/Dockerfile" ]]; then
            echo "::error::Worker image Dockerfile not found: $CONTEXT/Dockerfile"
            exit 1
          fi

          podman build \
            --pull=always \
            --no-cache \
            --file "$CONTEXT/Dockerfile" \
            --tag "$IMAGE" \
            .

          podman image exists "$IMAGE"

          echo "Built image: $IMAGE"

      # --------------------------------------------------
      # 7. Validate Compose configuration
      # --------------------------------------------------
      - name: Validate Compose configuration
        shell: bash
        working-directory: v2.home-security.uk
        run: |
          set -euo pipefail

          podman-compose -f compose.yaml config >/dev/null

          echo "Compose configuration validation passed."

      # --------------------------------------------------
      # 8. Start stack using launch-stack.sh option 1
      # --------------------------------------------------
      - name: Start container stack
        shell: bash
        working-directory: v2.home-security.uk
        run: |
          set -euo pipefail

          SCRIPT="./scripts/launch-stack.sh"

          if [[ ! -f "$SCRIPT" ]]; then
            echo "::error::launch-stack.sh not found."
            exit 1
          fi

          chmod +x "$SCRIPT"

          # Menu option 1 starts the stack.
          # Option 0 exits after startup; this avoids the interactive pause.
          # Original way: printf '1\n0\n' | timeout 240s bash "$SCRIPT"
          # Send option 1, wait 20 seconds, then send option 0.
          # Apply a 240-second timeout to the script.
          { printf '1\n'; sleep 20; printf '0\n'; } | timeout 240s bash "$SCRIPT"
      # --------------------------------------------------
      # 9. Check container health using option 4
      # --------------------------------------------------
      - name: Validate container health
        shell: bash
        working-directory: v2.home-security.uk
        run: |
          set -euo pipefail

          SCRIPT="./scripts/launch-stack.sh"

          # Menu option 4 displays container health.
          # Option 0 exits after displaying the results.
          printf '4\n0\n' | timeout 90s bash "$SCRIPT"

          echo
          echo "Final container status:"
          podman ps -a \
            --format "table {{.Names}}\t{{.Status}}"

          echo

          # Fail the pipeline if any Compose service is not running,
          # or has an unhealthy health check.
          python3 - <<'PY'
          import json
          import subprocess
          import sys

          result = subprocess.run(
              ["podman-compose", "-f", "compose.yaml", "ps", "-q"],
              capture_output=True,
              text=True,
              check=True,
          )

          ids = list(dict.fromkeys(
              line.strip() for line in result.stdout.splitlines()
              if line.strip()
          ))

          if not ids:
              sys.exit("No Compose containers were found.")

          failed = []

          for container_id in ids:
              inspected = subprocess.run(
                  [
                      "podman", "inspect",
                      "--format", "json",
                      container_id,
                  ],
                  capture_output=True,
                  text=True,
              )

              if inspected.returncode != 0:
                  failed.append(container_id)
                  continue

              data = json.loads(inspected.stdout)[0]
              state = data.get("State", {})
              status = state.get("Status", "unknown")
              health = state.get("Health", {}).get("Status")

              # Containers without a healthcheck are accepted if running.
              if status != "running":
                  failed.append(
                      f"{data.get('Name', container_id)}: {status}"
                  )
              elif health and health != "healthy":
                  failed.append(
                      f"{data.get('Name', container_id)}: {health}"
                  )

          if failed:
              print("Unhealthy or stopped containers:")
              for item in failed:
                  print(f" - {item}")
              sys.exit(1)

          print(f"All {len(ids)} Compose containers are running and healthy "
                "or have no configured healthcheck.")
          PY

      # --------------------------------------------------
      # 10. Deployment summary
      # --------------------------------------------------
      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          echo "========================================"
          echo "HOME SECURITY STACK DEPLOYMENT SUCCESS"
          echo "========================================"
          echo "Security scan: PASSED"
          echo "Podman tooling: VERIFIED"
          echo "Container policy: CONFIGURED"
          echo ".env: GENERATED"
          echo "Images: PULLED"
          echo "Worker template: BUILT"
          echo "Compose configuration: VALIDATED"
          echo "Stack startup: COMPLETED"
          echo "Container health: VERIFIED"
          echo "========================================"

      # --------------------------------------------------
      # Failure diagnostics
      # --------------------------------------------------
      - name: Collect container diagnostics
        if: failure()
        shell: bash
        working-directory: v2.home-security.uk
        run: |
          echo "Deployment failed. Collecting diagnostics..."

          podman ps -a \
            --format "table {{.Names}}\t{{.Status}}" || true

          echo
          podman-compose -f compose.yaml logs --tail=100 || true

          echo
          podman stats --no-stream || true

      # --------------------------------------------------
      # Remove generated secrets from workspace
      # --------------------------------------------------
      - name: Remove generated environment file
        if: always()
        shell: bash
        run: |
          rm -f v2.home-security.uk/.env
