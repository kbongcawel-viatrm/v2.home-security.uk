
name: Deploy Home Security Stack V2 (Dry-run)

on:
  workflow_dispatch: 
  workflow_run:
    workflows:
      - Security Scan
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: home-security-stack-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, Validate and Deploy
    # Permit manual runs; workflow_run runs only after a successful scan of main.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)

    runs-on:
      - ubuntu-latest

    timeout-minutes: 45

    steps:
      # --------------------------------------------------
      # 1. Checkout the exact commit that passed scanning
      # --------------------------------------------------
      - name: Checkout scanned commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1

      - name: Install missing Podman tooling
        shell: bash
        run: |
          set -euo pipefail

          packages=()
          command -v podman >/dev/null 2>&1 || packages+=(podman)
          command -v podman-compose >/dev/null 2>&1 || packages+=(podman-compose)

          if (( ${#packages[@]} > 0 )); then
            echo "Installing missing packages: ${packages[*]}"
            sudo apt-get update
            sudo apt-get install -y "${packages[@]}"
          else
            echo "Podman and podman-compose are already installed."
          fi

          podman --version
          podman-compose --version
          python3 --version
      # --------------------------------------------------
      # 2. Configure application directory and tooling
      # --------------------------------------------------
      - name: Configure deployment environment
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="v2.home-security.uk"

          if [[ ! -d "$APP_DIR" ]]; then
            echo "::error::Application directory not found: $APP_DIR"
            exit 1
          fi

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

          for cmd in podman podman-compose python3 timeout; do
            if ! command -v "$cmd" >/dev/null 2>&1; then
              echo "::error::Required command is missing: $cmd"
              echo "Install Podman and podman-compose in this GitHub Actions runner."
              exit 1
            fi
          done

          podman --version
          podman-compose --version

          podman info >/dev/null

      # --------------------------------------------------
      # 3. Authenticate to GHCR for remote Buildah layer caches
      # --------------------------------------------------
      - name: Configure Podman build cache
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          CACHE_AUTH_FILE="$RUNNER_TEMP/podman-auth.json"
          install -m 600 /dev/null "$CACHE_AUTH_FILE"

          if printf '%s' "$GH_TOKEN" | podman login \
            --authfile "$CACHE_AUTH_FILE" \
            --username "$GITHUB_ACTOR" \
            --password-stdin ghcr.io; then
            echo "REGISTRY_AUTH_FILE=$CACHE_AUTH_FILE" >> "$GITHUB_ENV"
            echo "PODMAN_CACHE_ENABLED=true" >> "$GITHUB_ENV"
            echo "Podman remote layer cache authentication configured."
          else
            rm -f "$CACHE_AUTH_FILE"
            echo "PODMAN_CACHE_ENABLED=false" >> "$GITHUB_ENV"
            echo "::warning::GHCR cache authentication failed; builds will run without remote cache."
          fi

      # --------------------------------------------------
      # 4. Configure container signature policy
      # --------------------------------------------------
      - name: Configure container registry policy
        shell: bash
        run: |
          set -euo pipefail

          POLICY_SOURCE="$APP_DIR/containers-policy.json"
          POLICY_DESTINATION="$HOME/.config/containers/policy.json"

          if [[ ! -f "$POLICY_SOURCE" ]]; then
            echo "::error::containers-policy.json not found."
            exit 1
          fi

          python3 -m json.tool "$POLICY_SOURCE" >/dev/null

          mkdir -p "$(dirname "$POLICY_DESTINATION")"

          if [[ -f "$POLICY_DESTINATION" ]]; then
            cp "$POLICY_DESTINATION" \
              "${POLICY_DESTINATION}.backup"
          fi

          install -m 600 \
            "$POLICY_SOURCE" \
            "$POLICY_DESTINATION"

          echo "Container signature policy configured."

      # --------------------------------------------------
      # 5. Generate .env from GitHub Secrets
      # --------------------------------------------------
      - name: Generate environment configuration
        shell: bash
        working-directory: v2.home-security.uk
        env:
          OPENOBSERVE_USER: ${{ secrets.OPENOBSERVE_USER }}
          OPENOBSERVE_PASSWORD: ${{ secrets.OPENOBSERVE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          if [[ ! -f .env.example ]]; then
            echo "::error::.env.example not found."
            exit 1
          fi

          python3 - <<'PY'
          import os
          from pathlib import Path

          source = Path(".env.example")
          destination = Path(".env")

          required = {
              "OPENOBSERVE_USER": os.environ.get("OPENOBSERVE_USER", ""),
              "OPENOBSERVE_PASSWORD": os.environ.get("OPENOBSERVE_PASSWORD", ""),
          }

          missing = [
              key for key, value in required.items()
              if not value
          ]

          if missing:
              raise SystemExit(
                  "Missing GitHub Secrets: " + ", ".join(missing)
              )

          for key, value in required.items():
              if "\n" in value or "\r" in value:
                  raise SystemExit(
                      f"{key} contains an unsupported newline."
                  )

          lines = source.read_text().splitlines()
          counts = {key: 0 for key in required}
          output = []

          def quote_dotenv(value):
              escaped = value.replace("\\", "\\\\").replace('"', '\\"')
              return f'"{escaped}"'

          for line in lines:
              if "=" not in line or line.lstrip().startswith("#"):
                  output.append(line)
                  continue

              key = line.split("=", 1)[0].strip()

              if key in required:
                  counts[key] += 1
                  output.append(f"{key}={quote_dotenv(required[key])}")
              else:
                  output.append(line)

          invalid = [
              key for key, count in counts.items()
              if count != 1
          ]

          if invalid:
              raise SystemExit(
                  "Expected exactly one .env.example entry for: "
                  + ", ".join(invalid)
              )

          destination.write_text("\n".join(output) + "\n")
          destination.chmod(0o600)

          print(".env generated successfully.")
          PY

      # --------------------------------------------------
      # 6. Validate Compose configuration before downloading/building images
      # --------------------------------------------------
      - name: Validate Compose configuration
        shell: bash
        working-directory: v2.home-security.uk
        run: |
          set -euo pipefail

          podman-compose -f compose.yaml config >/dev/null
          echo "Compose configuration validation passed."

      # --------------------------------------------------
      # 7. Pull container images
      # --------------------------------------------------
      - name: Pull container images
        shell: bash
        working-directory: v2.home-security.uk
        run: |
          set -euo pipefail

          podman-compose -f compose.yaml pull

      # --------------------------------------------------
      # 8. Build worker-template image
      # --------------------------------------------------
      - name: Build worker-template image
        shell: bash
        working-directory: v2.home-security.uk
        run: |
          set -euo pipefail

          IMAGE="demo.goharbor.io/home-security-uk/worker-template:1.3"
          CONTEXT="./worker-image"
          CACHE_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-worker-template-cache"

          if [[ ! -f "$CONTEXT/Dockerfile" ]]; then
            echo "::error::Worker image Dockerfile not found: $CONTEXT/Dockerfile"
            exit 1
          fi

          build_args=(
            --layers
            --ignorefile "$CONTEXT/.containerignore" \
            --file "$CONTEXT/Dockerfile" \
            --tag "$IMAGE"
          )

          if [[ "${PODMAN_CACHE_ENABLED:-false}" == "true" ]]; then
            if ! podman build \
              --layers \
              --cache-from "$CACHE_IMAGE" \
              --cache-to "$CACHE_IMAGE" \
              --ignorefile "$CONTEXT/.containerignore" \
              --file "$CONTEXT/Dockerfile" \
              --tag "$IMAGE" \
              .; then
              echo "::warning::Remote cache build failed; retrying with cache export only."
              if ! podman build \
                --layers \
                --cache-to "$CACHE_IMAGE" \
                --ignorefile "$CONTEXT/.containerignore" \
                --file "$CONTEXT/Dockerfile" \
                --tag "$IMAGE" \
                .; then
                echo "::warning::Remote cache export unavailable; retrying with local layer caching only."
                podman build "${build_args[@]}" .
              fi
            fi
          else
            podman build "${build_args[@]}" .
          fi

          podman image exists "$IMAGE"
          echo "Built image: $IMAGE"

      # --------------------------------------------------
      # 9. Start stack using launch-stack.sh option 1
      # --------------------------------------------------
      - name: Start container stack
        shell: bash
        working-directory: v2.home-security.uk
        run: |
          set -euo pipefail

          SCRIPT="./scripts/launch-stack.sh"

          if [[ ! -f "$SCRIPT" ]]; then
            echo "::error::launch-stack.sh not found."
            exit 1
          fi

          chmod +x "$SCRIPT"

          # Use the script's CLI mode; avoid interactive stdin/menu handling in CI.
          timeout 240s bash "$SCRIPT" 1
      # --------------------------------------------------
      # 10. Check container health using option 4
      # --------------------------------------------------
      - name: Validate container health
        shell: bash
        working-directory: v2.home-security.uk
        run: |
          set -euo pipefail
          echo "=== Container Resource Limits ==="
          echo "---------------------------------"
          printf "%-20s %12s %15s %16s\n" "NAME" "MEMORY(GB)" "CPU_QUOTA(ms)" "CPU_PERIOD(ms)"
          printf "%s\n" "-----------------------------------------------------------------------"
          
          podman inspect --format "{{.Name}} {{.HostConfig.Memory}} {{.HostConfig.CpuQuota}} {{.HostConfig.CpuPeriod}}" \
            openobserve ollama fluent-bit security-ai ansible-ai 2>&1 |
          while read -r name memory cpu_quota cpu_period; do
              memory_gb=$(awk -v m="$memory" "BEGIN {printf \"%.2f\", m/1000000000}")
              if [ "$cpu_quota" -lt 0 ]; then
                  quota_ms="unlimited"
              else
                  quota_ms=$(awk -v q="$cpu_quota" "BEGIN {printf \"%.2f\", q/1000}")
              fi
              period_ms=$(awk -v p="$cpu_period" "BEGIN {printf \"%.2f\", p/1000}")
              printf "%-20s %12s %15s %16s\n" "$name" "$memory_gb" "$quota_ms" "$period_ms"
          done
          
          echo
          echo "=== Container Resource Usage ==="
          echo "--------------------------------"
          podman stats --all --no-stream
      # --------------------------------------------------
      # 11. Deployment summary
      # --------------------------------------------------
      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          echo "========================================"
          echo "HOME SECURITY STACK DEPLOYMENT SUCCESS"
          echo "========================================"
          echo "Security scan: PASSED"
          echo "Podman tooling: VERIFIED"
          echo "Container policy: CONFIGURED"
          echo ".env: GENERATED"
          echo "Images: PULLED"
          echo "Worker template: BUILT"
          echo "Compose configuration: VALIDATED"
          echo "Stack startup: COMPLETED"
          echo "Container health: VERIFIED"
          echo "========================================"

      # --------------------------------------------------
      # Failure diagnostics
      # --------------------------------------------------
      - name: Collect container diagnostics
        if: failure()
        shell: bash
        working-directory: v2.home-security.uk
        run: |
          echo "Deployment failed. Collecting diagnostics..."

          podman ps -a \
            --format "table {{.Names}}\t{{.Status}}" || true

          echo
          podman-compose -f compose.yaml logs --tail=100 || true

          echo
          podman stats --no-stream || true

      # --------------------------------------------------
      # Remove generated secrets from workspace
      # --------------------------------------------------
      - name: Remove generated credentials and environment file
        if: always()
        shell: bash
        run: |
          set +e
          podman logout --authfile "$RUNNER_TEMP/podman-auth.json" ghcr.io >/dev/null 2>&1
          rm -f "$RUNNER_TEMP/podman-auth.json"
          rm -f v2.home-security.uk/.env
