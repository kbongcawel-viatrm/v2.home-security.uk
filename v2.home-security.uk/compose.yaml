name: v2.home-security.uk

# NOTE: depends_on is deliberately not used. podman-compose recreates/restarts
# dependencies when one service is brought up, so restarting a single container
# would bounce its dependencies. Services rely on restart: unless-stopped to
# retry until their upstreams are available. Restart one service with:
#   podman-compose up -d --no-deps <service>   (or: podman restart <name>)
services:
  openobserve:
    image: local/openobserve-with-curl:${OPENOBSERVE_IMAGE_TAG:-curl-healthcheck}
    build:
      context: .
      dockerfile: openobserve/Dockerfile
      args:
        OPENOBSERVE_BASE_IMAGE: public.ecr.aws/zinclabs/openobserve:${OPENOBSERVE_TAG:-latest}
    pull_policy: never
    container_name: openobserve
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPENOBSERVE_PORT:-5080}:5080/tcp"
    environment:
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_USER:?Set OPENOBSERVE_USER in .env}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_PASSWORD:?Set OPENOBSERVE_PASSWORD in .env}
      ZO_SMTP_ENABLED: ${ZO_SMTP_ENABLED:-false}
      ZO_SMTP_HOST: ${ZO_SMTP_HOST:-}
      ZO_SMTP_PORT: ${ZO_SMTP_PORT:-587}
      ZO_SMTP_USER_NAME: ${ZO_SMTP_USER_NAME:-}
      ZO_SMTP_PASSWORD: ${ZO_SMTP_PASSWORD:-}
      ZO_SMTP_FROM_EMAIL: ${ZO_SMTP_FROM_EMAIL:-}
      ZO_SMTP_ENCRYPTION: ${ZO_SMTP_ENCRYPTION:-starttls}
      ZO_DATA_DIR: /data
      ZO_LOCAL_MODE: "true"
      ZO_MEMORY_CACHE_MAX_SIZE: "128"
      ZO_MEMORY_CACHE_DATAFUSION_MAX_SIZE: "256"
      TZ: ${TZ:-Asia/Manila}
    cpus: 1.00
    mem_limit: 2048m
    volumes:
      - openobserve_data:/data
    networks:
      - security
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  prometheus:
    image: docker.io/prom/prometheus:${PROMETHEUS_TAG:-latest}
    pull_policy: never
    container_name: prometheus
    # Run as container root: in rootless Podman this maps to the host user, so the
    # bind-mounted prometheus.yml stays readable regardless of host file permissions.
    user: "0:0"
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        sed 's|[$][{]OPENOBSERVE_ORG[}]|'"$${OPENOBSERVE_ORG}"'|g' /etc/prometheus/prometheus.yml > /tmp/prometheus.yml
        sed -i 's|[$][{]OPENOBSERVE_USER[}]|'"$${OPENOBSERVE_USER}"'|g' /tmp/prometheus.yml
        sed -i 's|[$][{]OPENOBSERVE_PASSWORD[}]|'"$${OPENOBSERVE_PASSWORD}"'|g' /tmp/prometheus.yml
        exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=$${PROMETHEUS_RETENTION:-15d}
    environment:
      OPENOBSERVE_USER: ${OPENOBSERVE_USER:?Set OPENOBSERVE_USER in .env}
      OPENOBSERVE_PASSWORD: ${OPENOBSERVE_PASSWORD:?Set OPENOBSERVE_PASSWORD in .env}
      OPENOBSERVE_ORG: ${OPENOBSERVE_ORG:-default}
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090/tcp"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - prometheus_data:/prometheus
    networks:
      - security
    cpus: 0.10
    mem_limit: 160m
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "promtool", "query", "instant", "http://localhost:9090", "up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ollama:
    image: docker.io/ollama/ollama:${OLLAMA_TAG:-latest}
    pull_policy: never
    container_name: ollama
    restart: unless-stopped
    environment:
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    cpus: 1.50
    mem_limit: 2048m
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - security
    # Deliberately not published to the host; internal services use ollama:11434.
    stop_grace_period: 30s
    healthcheck:
      # Keep liveness inexpensive: inference is validated by security-ai and the
      # explicit end-to-end smoke test, not every 30-second health probe.
      test: ["CMD-SHELL", "/bin/ollama list | grep -Fq '${OLLAMA_MODEL:-qwen2.5:3b}'"]
      interval: 30s
      timeout: 60s
      retries: 3
      start_period: 60s

  fluent-bit:
    image: cr.fluentbit.io/fluent/fluent-bit:${FLUENT_BIT_TAG:-3.2}
    container_name: fluent-bit
    pull_policy: never 
    restart: unless-stopped
    ports:
       - "127.0.0.1:2020:2020"
    environment:
      OPENOBSERVE_USER: ${OPENOBSERVE_USER:?Set OPENOBSERVE_USER in .env}
      OPENOBSERVE_PASSWORD: ${OPENOBSERVE_PASSWORD:?Set OPENOBSERVE_PASSWORD in .env}
      OPENOBSERVE_ORG: ${OPENOBSERVE_ORG:-default}
      TZ: ${TZ:-Asia/Manila}
    cpus: 0.20
    mem_limit: 128m
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro,Z
      - /var/log/suricata-export:/var/log/suricata-export:ro
      - ${BOOT_LOG_PATH:-/var/log/boot.log}:/host/boot.log:ro
      - /etc/machine-id:/etc/machine-id:ro
      - fluent_bit_state:/fluent-bit/state
      - security_log_archive:/var/log/security-archive
      - /run/log/journal:/run/log/journal:ro
      - /var/log/journal:/var/log/journal:ro
      - /var/log/suricata-export:/var/log/audit:ro
      - /var/log/suricata-export:/var/log/aide:ro
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro,Z
    networks:
      - security
    command: ["-c", "/fluent-bit/etc/fluent-bit.conf"]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.conf", "--dry-run"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  
  security-ai:
    image: demo.goharbor.io/home-security-uk/worker-template:1.3
    pull_policy: never
    container_name: security-ai
    command: ["/app/security-ai/worker.py"]
    userns_mode: "keep-id:uid=10001,gid=10001"
    restart: unless-stopped
    environment:
      ANSIBLE_LOCAL_TEMP: /tmp/ansible-local
      ANSIBLE_REMOTE_TEMP: /tmp/ansible-remote
      OPENOBSERVE_INPUT_STREAMS: "security_logs"
      OPENOBSERVE_URL: http://openobserve:5080
      OPENOBSERVE_USER: ${OPENOBSERVE_USER:?Set OPENOBSERVE_USER in .env}
      OPENOBSERVE_PASSWORD: ${OPENOBSERVE_PASSWORD:?Set OPENOBSERVE_PASSWORD in .env}
      OPENOBSERVE_ORG: ${OPENOBSERVE_ORG:-default}
      OPENOBSERVE_TRACES_STREAM_NAME: ${OPENOBSERVE_TRACES_STREAM_NAME:-default}
      OPENOBSERVE_QUERY_INTERVAL_MINUTES: ${OPENOBSERVE_QUERY_INTERVAL_MINUTES:-5}
      OPENOBSERVE_QUERY_OVERLAP_SECONDS: ${OPENOBSERVE_QUERY_OVERLAP_SECONDS:-30}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_REQUEST_TIMEOUT_SECONDS: ${OLLAMA_REQUEST_TIMEOUT_SECONDS:-600}
      ANALYSIS_INTERVAL_SECONDS: ${ANALYSIS_INTERVAL_SECONDS:-300}
      MAX_EVENTS_PER_BATCH: ${MAX_EVENTS_PER_BATCH:-30}
      ARTIFACTS_DIR: /artifacts/generated/security-ai
      TZ: ${TZ:-Asia/Manila}
    cpus: 0.10
    mem_limit: 128m
    volumes:
      - security_ai_state:/state
      - ./security-ai:/app/security-ai:ro,Z
      - ./artifacts/generated:/artifacts/generated:rw,z
      - ansible_ai_temp:/tmp/ansible-local
    networks:
      - security
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys; expected='/app/security-ai/worker.py'; sys.exit(0 if os.path.exists('/proc/1/cmdline') and expected.encode() in open('/proc/1/cmdline','rb').read() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  ansible-ai:
    image: demo.goharbor.io/home-security-uk/worker-template:1.3
    pull_policy: never
    container_name: ansible-ai
    command: ["/app/ansible-ai/worker.py"]
    userns_mode: "keep-id:uid=10001,gid=10001"
    restart: unless-stopped
    environment:
      ANSIBLE_LOCAL_TEMP: /tmp/ansible-local
      ANSIBLE_REMOTE_TEMP: /tmp/ansible-remote
      SECURITY_ARTIFACTS_DIR: /artifacts/generated/security-ai
      ANSIBLE_ARTIFACTS_DIR: /artifacts/generated/ansible-ai
      PLAYBOOK_INTERVAL_SECONDS: ${PLAYBOOK_INTERVAL_SECONDS:-30}
      TZ: ${TZ:-Asia/Manila}
    cpus: 0.10
    mem_limit: 128m
    volumes:
      - ./artifacts/generated:/artifacts/generated:rw,z
      - ansible_ai_temp:/tmp/ansible-local
    networks:
      - security
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys; expected='/app/ansible-ai/worker.py'; sys.exit(0 if os.path.exists('/proc/1/cmdline') and expected.encode() in open('/proc/1/cmdline','rb').read() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  security:
    driver: bridge

volumes:
  openobserve_data:
  ollama_data:
  fluent_bit_state:
  security_ai_state:
  security_log_archive:
  ansible_ai_temp:
  prometheus_data:
