[SERVICE]
    Flush                     5
    Daemon                    Off
    Log_Level                 info
    Parsers_File              parsers.conf
    storage.path              /fluent-bit/state
    storage.sync              normal
    storage.checksum          off
    storage.backlog.mem_limit 10M

[INPUT]
    Name              systemd
    Tag               host.journal
    DB                /fluent-bit/state/systemd.db
    Read_From_Tail    On

[INPUT]
    Name              tail
    Tag               security.suricata
    Path              /var/log/suricata/eve.json
    Parser            json
    DB                /fluent-bit/state/suricata-eve.db
    Read_from_Head    True
    Refresh_Interval  5
    Rotate_Wait       30
    Skip_Long_Lines   On
    Mem_Buf_Limit     10MB

[FILTER]
    Name              modify
    Match             security.*
    Add               source suricata

[OUTPUT]
    Name              http
    Match             security.*
    Host              openobserve
    Port              5080
    URI               /api/${OPENOBSERVE_ORG}/security_logs/_json
    HTTP_User         ${OPENOBSERVE_USER}
    HTTP_Passwd       ${OPENOBSERVE_PASSWORD}
    Format            json_lines
    Json_date_key     _timestamp
    Json_date_format  iso8601
    tls               Off
    Retry_Limit       False

[FILTER]
    Name              modify
    Match             host.*
    Add               source host-journal

[OUTPUT]
    Name              http
    Match             host.*
    Host              openobserve
    Port              5080
    URI               /api/${OPENOBSERVE_ORG}/security_logs/_json
    HTTP_User         ${OPENOBSERVE_USER}
    HTTP_Passwd       ${OPENOBSERVE_PASSWORD}
    Format            json_lines
    Json_date_key     _timestamp
    Json_date_format  iso8601
    tls               Off
    Retry_Limit       False
