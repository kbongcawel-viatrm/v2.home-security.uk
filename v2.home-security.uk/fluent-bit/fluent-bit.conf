
[SERVICE]
    Flush                     5
    Daemon                    Off
    Log_Level                 info
    Parsers_File              parsers.conf
    storage.path              /fluent-bit/state
    storage.sync              normal
    storage.checksum          off
    storage.backlog.mem_limit 10M
    storage.metrics           On

# --------------------------------------------------
# SYSTEMD JOURNAL
# --------------------------------------------------
[INPUT]
    Name              systemd
    Tag               host.journal
    DB                /fluent-bit/state/systemd.db
    Read_From_Tail    On
    storage.type      filesystem

# --------------------------------------------------
# SURICATA EVE JSON
# --------------------------------------------------
[INPUT]
    Name              tail
    Tag               security.suricata.eve
    Path              /var/log/suricata/eve.json
    Parser            json
    DB                /fluent-bit/state/suricata-eve.db
    Read_from_Head    Off
    Refresh_Interval  5
    Rotate_Wait       30
    Skip_Long_Lines   On
    Mem_Buf_Limit     10MB
    Path_Key          source_file
    storage.type      filesystem

[FILTER]
    Name              modify
    Match             security.suricata.eve
    Add               source suricata

# --------------------------------------------------
# AUDITD
# --------------------------------------------------
[INPUT]
    Name              tail
    Tag               security.auditd
    Path              /var/log/audit/audit.log
    DB                /fluent-bit/state/auditd.db
    Read_from_Head    Off
    Refresh_Interval  2
    Rotate_Wait       30
    Skip_Long_Lines   On
    Mem_Buf_Limit     10MB
    Path_Key          source_file
    storage.type      filesystem

[FILTER]
    Name              modify
    Match             security.auditd
    Add               source auditd

# --------------------------------------------------
# AIDE INTEGRITY REPORTS
# Configure AIDE to write reports to this path.
# --------------------------------------------------
[INPUT]
    Name              tail
    Tag               security.aide
    Path              /var/log/aide/aide.log
    DB                /fluent-bit/state/aide.db
    Read_from_Head    Off
    Refresh_Interval  5
    Rotate_Wait       30
    Skip_Long_Lines   On
    Mem_Buf_Limit     5MB
    Path_Key          source_file
    storage.type      filesystem

[FILTER]
    Name              modify
    Match             security.aide
    Add               source aide

# --------------------------------------------------
# LABEL JOURNAL EVENTS
# --------------------------------------------------
[FILTER]
    Name              modify
    Match             host.journal
    Add               source systemd-journal

# --------------------------------------------------
# OPENOBSERVE — SECURITY EVENTS
# --------------------------------------------------
[OUTPUT]
    Name              http
    Match             security.*
    Host              openobserve
    Port              5080
    URI               /api/${OPENOBSERVE_ORG}/security_logs/_multi
    HTTP_User         ${OPENOBSERVE_USER}
    HTTP_Passwd       ${OPENOBSERVE_PASSWORD}
    Format            json_lines
    Json_date_key     _timestamp
    Json_date_format  iso8601
    tls               Off
    Retry_Limit       False

# --------------------------------------------------
# OPENOBSERVE — HOST JOURNAL
# --------------------------------------------------
[OUTPUT]
    Name              http
    Match             host.journal
    Host              openobserve
    Port              5080
    URI               /api/${OPENOBSERVE_ORG}/security_logs/_multi
    HTTP_User         ${OPENOBSERVE_USER}
    HTTP_Passwd       ${OPENOBSERVE_PASSWORD}
    Format            json_lines
    Json_date_key     _timestamp
    Json_date_format  iso8601
    tls               Off
    Retry_Limit       False
