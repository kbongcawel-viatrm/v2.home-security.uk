[SERVICE]
    Flush                     5
    Daemon                    Off
    Log_Level                 info
    Parsers_File              parsers.conf
    storage.path              /fluent-bit/state
    storage.sync              normal
    storage.checksum          off
    storage.backlog.mem_limit 10M
    storage.metrics           On

[INPUT]
    Name              systemd
    Tag               host.journal
    DB                /fluent-bit/state/systemd.db
    Read_From_Tail    On
    storage.type      filesystem

[INPUT]
    Name              tail
    Tag               security.bootlog
    Path              /host/boot.log
    DB                /fluent-bit/state/boot-log.db
    Read_from_Head    True
    Refresh_Interval  5
    Rotate_Wait       30
    Skip_Long_Lines   On
    Mem_Buf_Limit     10MB
    Path_Key          host_log_path
    storage.type      filesystem

[INPUT]
    Name              tail
    Tag               security.suricata
    Path              /var/log/suricata/eve.json
    Parser            json
    DB                /fluent-bit/state/suricata-eve.db
    Read_from_Head    True
    Refresh_Interval  5
    Rotate_Wait       30
    Skip_Long_Lines   On
    Mem_Buf_Limit     10MB
    storage.type      filesystem

[INPUT]
    Name              tail
    Tag               security.suricata.text
    Path              /var/log/suricata/*.log
    DB                /fluent-bit/state/suricata-text.db
    Read_from_Head    True
    Refresh_Interval  5
    Rotate_Wait       30
    Skip_Long_Lines   On
    Mem_Buf_Limit     10MB
    Path_Key          suricata_log_path
    storage.type      filesystem

[FILTER]
    Name              modify
    Match             security.suricata*
    Add               source suricata

[FILTER]
    Name              modify
    Match             security.bootlog
    Add               source host-bootlog

[OUTPUT]
    Name              http
    Match             security.*
    Host              openobserve
    Port              5080
    URI               /api/${OPENOBSERVE_ORG}/security_logs/_json
    HTTP_User         ${OPENOBSERVE_USER}
    HTTP_Passwd       ${OPENOBSERVE_PASSWORD}
    Format            json_lines
    Json_date_key     _timestamp
    Json_date_format  iso8601
    tls               Off
    Retry_Limit       False

[OUTPUT]
    Name              file
    Match             *
    Path              /var/log/security-archive
    File              fluent-bit-events.jsonl

[FILTER]
    Name              modify
    Match             host.*
    Add               source host-journal

[FILTER]
    Name              rewrite_tag
    Match             host.*
    Rule              $_SYSTEMD_UNIT ^firewalld\.service$ firewall.$TAG false
    Rule              $_TRANSPORT ^kernel$ kernel.$TAG false
    Rule              $CONTAINER_ID_FULL .+ container.$TAG false

[OUTPUT]
    Name              http
    Match             host.*
    Host              openobserve
    Port              5080
    URI               /api/${OPENOBSERVE_ORG}/security_logs/_json
    HTTP_User         ${OPENOBSERVE_USER}
    HTTP_Passwd       ${OPENOBSERVE_PASSWORD}
    Format            json_lines
    Json_date_key     _timestamp
    Json_date_format  iso8601
    tls               Off
    Retry_Limit       False

[FILTER]
    Name              modify
    Match             firewall.*
    Add               source firewalld

[OUTPUT]
    Name              http
    Match             firewall.*
    Host              openobserve
    Port              5080
    URI               /api/${OPENOBSERVE_ORG}/firewall_logs/_json
    HTTP_User         ${OPENOBSERVE_USER}
    HTTP_Passwd       ${OPENOBSERVE_PASSWORD}
    Format            json_lines
    Json_date_key     _timestamp
    Json_date_format  iso8601
    tls               Off
    Retry_Limit       False

[FILTER]
    Name              modify
    Match             container.*
    Add               source podman-container

[OUTPUT]
    Name              http
    Match             container.*
    Host              openobserve
    Port              5080
    URI               /api/${OPENOBSERVE_ORG}/container_logs/_json
    HTTP_User         ${OPENOBSERVE_USER}
    HTTP_Passwd       ${OPENOBSERVE_PASSWORD}
    Format            json_lines
    Json_date_key     _timestamp
    Json_date_format  iso8601
    tls               Off
    Retry_Limit       False

[FILTER]
    Name              modify
    Match             kernel.*
    Add               source host-kernel

[OUTPUT]
    Name              http
    Match             kernel.*
    Host              openobserve
    Port              5080
    URI               /api/${OPENOBSERVE_ORG}/kernel_logs/_json
    HTTP_User         ${OPENOBSERVE_USER}
    HTTP_Passwd       ${OPENOBSERVE_PASSWORD}
    Format            json_lines
    Json_date_key     _timestamp
    Json_date_format  iso8601
    tls               Off
    Retry_Limit       False
