
[SERVICE]
    Flush                     1
    Daemon                    Off
    Log_Level                 debug
    Parsers_File              parsers.conf
    storage.path              /fluent-bit/state
    storage.sync              normal
    storage.checksum          off
    storage.backlog.mem_limit 10M
    storage.metrics           On
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020

# --------------------------------------------------
# SYSTEMD JOURNAL - KERNEL MESSAGES
# journalctl -k outputs kernel messages with _TRANSPORT=kernel
# --------------------------------------------------
[INPUT]
    Name              systemd
    Tag               host.kernel
    DB                /fluent-bit/state/kernel.db
    Systemd_Filter    _TRANSPORT=kernel
    Read_From_Tail    On
    storage.type      filesystem
# --------------------------------------------------
# SYSTEMD JOURNAL - BOOT LOG
# journalctl -b outputs boot messages
# --------------------------------------------------
[INPUT]
    Name              systemd
    Tag               host.boot
    DB                /fluent-bit/state/boot.db
    Systemd_Filter    _SYSTEMD_UNIT=systemd-journald.service
    Read_From_Tail    On
    storage.type      filesystem
# --------------------------------------------------
# SYSTEMD JOURNAL - GENERAL SYSTEM LOGS
# --------------------------------------------------
[INPUT]
    Name              systemd
    Tag               host.journal
    DB                /fluent-bit/state/systemd.db
    Read_From_Tail    On
    storage.type      filesystem

# --------------------------------------------------
# SURICATA EVE JSON
# --------------------------------------------------
[INPUT]
    Name              tail
    Tag               suricata.eve
    Path              /var/log/suricata-export/eve.json
    Parser            json
    DB                /fluent-bit/state/suricata-eve.db
    Read_from_Head    On
    Refresh_Interval  30
    Rotate_Wait       30
    Skip_Long_Lines   On
    Mem_Buf_Limit     10MB
    Path_Key          source_file
    storage.type      filesystem

[FILTER]
    Name              modify
    Match             suricata.eve
    Add               source suricata

[INPUT]
    Name              tail
    Tag               suricata.log
    Path              /var/log/suricata-export/suricata.log
    Parser            json
    DB                /fluent-bit/state/suricata-log.db
    Read_from_Head    On
    Refresh_Interval  10
    Rotate_Wait       30
    Skip_Long_Lines   On
    Mem_Buf_Limit     10MB
    Path_Key          source_file
    storage.type      filesystem

[FILTER]
    Name              modify
    Match             suricata.log
    Add               source suricata


[INPUT]
    Name              tail
    Tag               suricata.stats
    Path              /var/log/suricata-export/stats.log
    Parser            json
    DB                /fluent-bit/state/suricata-stats.db
    Read_from_Head    On
    Refresh_Interval  25
    Rotate_Wait       30
    Skip_Long_Lines   On
    Mem_Buf_Limit     10MB
    Path_Key          source_file
    storage.type      filesystem

[FILTER]
    Name              modify
    Match             suricata.stats
    Add               source suricata

# --------------------------------------------------
# SURICATA FAST ALERTS (text format)
# --------------------------------------------------
[INPUT]
    Name              tail
    Tag               suricata.fast
    Path              /var/log/suricata-export/fast.log
    DB                /fluent-bit/state/suricata-fast.db
    Read_from_Head    On
    Refresh_Interval  30
    Rotate_Wait       30
    Skip_Long_Lines   On
    Mem_Buf_Limit     10MB
    Path_Key          source_file
    storage.type      filesystem

[FILTER]
    Name              modify
    Match             suricata.fast
    Add               source suricata
    Add               event_type alert

# --------------------------------------------------
# CLAMAV SCAN LOGS (text format)
# --------------------------------------------------
[INPUT]
    Name              tail
    Tag               security.clamav.scan
    Path              /var/log/suricata-export/clamav-scan.log
    DB                /fluent-bit/state/clamav-scan.db
    Read_from_Head    On
    Refresh_Interval  60
    Rotate_Wait       30
    Skip_Long_Lines   On
    Mem_Buf_Limit     5MB
    Path_Key          source_file
    storage.type      filesystem

[FILTER]
    Name              modify
    Match             security.clamav.scan
    Add               source clamav
    Add               event_type scan_summary

[INPUT]
    Name              tail
    Tag               security.clamav.secureblue-scan
    Path              /var/log/suricata-export/clamav-secureblue-scan.log
    DB                /fluent-bit/state/clamav-secureblue-scan.db
    Read_from_Head    On
    Refresh_Interval  60
    Rotate_Wait       30
    Skip_Long_Lines   On
    Mem_Buf_Limit     5MB
    Path_Key          source_file
    storage.type      filesystem

[FILTER]
    Name              modify
    Match             security.clamav.secureblue-scan
    Add               source clamav
    Add               event_type scan



# --------------------------------------------------
# AUDITD
# --------------------------------------------------
[INPUT]
    Name              tail
    Tag               security.auditd
    Path              /var/log/audit/audit.log
    DB                /fluent-bit/state/auditd.db
    Read_from_Head    Off
    Refresh_Interval  20
    Rotate_Wait       30
    Skip_Long_Lines   On
    Mem_Buf_Limit     10MB
    Path_Key          source_file
    storage.type      filesystem

[FILTER]
    Name              modify
    Match             security.auditd
    Add               source auditd

# --------------------------------------------------
# AIDE INTEGRITY REPORTS
# --------------------------------------------------
[INPUT]
    Name              tail
    Tag               security.aide
    Path              /var/log/aide/aide.log
    DB                /fluent-bit/state/aide.db
    Read_from_Head    Off
    Refresh_Interval  15
    Rotate_Wait       30
    Skip_Long_Lines   On
    Mem_Buf_Limit     5MB
    Path_Key          source_file
    storage.type      filesystem

[FILTER]
    Name              modify
    Match             security.aide
    Add               source aide

# --------------------------------------------------
# LABEL FILTERS
# --------------------------------------------------
[FILTER]
    Name              modify
    Match             host.kernel
    Add               source kernel

[FILTER]
    Name              modify
    Match             host.boot
    Add               source boot

[FILTER]
    Name              modify
    Match             host.journal
    Add               source systemd-journal

# --------------------------------------------------
# OUTPUT - OPENOBSERVE
# --------------------------------------------------
[OUTPUT]
    Name              http
    Match             *
    Host              openobserve
    Port              5080
    URI               /api/${OPENOBSERVE_ORG}/security_logs/_multi
    HTTP_User         ${OPENOBSERVE_USER}
    HTTP_Passwd       ${OPENOBSERVE_PASSWORD}
    Format            json_lines
    Json_date_key     _timestamp
    Json_date_format  iso8601
    tls               Off
    Retry_Limit       False
